name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build & tests (unitaires + intégration)
        run: ./mvnw -B verify
      - name: Build de l'image Docker
        run: docker build -t cashbank-api:${{ github.sha }} .
